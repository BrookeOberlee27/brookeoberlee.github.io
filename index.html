<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Engineering portfolio of Brooke Oberlee, a mechanical engineering student at UMass Amherst." />
  <meta name="theme-color" content="#f3f3ee" />
  <title>Brooke Oberlee | Engineering Portfolio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2326336b'/%3E%3Ctext x='16' y='23' font-family='Arial' font-size='20' font-weight='700' text-anchor='middle' fill='%23f3f3ee'%3EB%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700&display=swap" />
  <link rel="stylesheet" href="styles.css" />
  <script defer src="js/content.js"></script>
  <script defer src="js/common.js"></script>
  <script defer src="js/main.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="wordmark" href="#top">Brooke Oberlee</a>
      <nav class="nav" aria-label="Sections">
        <a href="#work">Work</a>
        <a href="#clubs">Clubs</a>
        <a href="#research">Research</a>
        <a href="#hackathons">Hackathons</a>
        <a href="#classes">Classes</a>
        <a href="#interests">Interests</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main id="top">
    <section class="hero band theme-cream" aria-label="About me">
      <div class="hero-text">
        <h1><span id="hero-name"></span><span class="light" id="hero-tagline"></span></h1>
        <div class="hero-lines" id="hero-lines"></div>
        <div class="hero-actions">
          <a class="button button-solid" href="#work">See my work</a>
          <a class="button" id="hero-email" href="#contact">Get in touch</a>
        </div>
      </div>
      <figure class="hero-photo">
        <img id="hero-photo" alt="" />
      </figure>
    </section>

    <div id="groups"></div>

    <section class="band theme-cream" id="interests" aria-labelledby="interests-title">
      <div class="shell">
        <h2 id="interests-title">Interests outside of engineering</h2>
        <div class="interest-grid" id="interest-grid"></div>
      </div>
    </section>

    <section class="band theme-teal" id="contact" aria-labelledby="contact-title">
      <div class="shell">
        <h2 id="contact-title">Skills and contact</h2>
        <div class="contact-grid">
          <dl class="skills" id="skills"></dl>
          <div class="contact-card">
            <h3>Contact</h3>
            <p><a id="email-link" href="#"></a></p>
            <p><a id="linkedin-link" href="#" target="_blank" rel="noreferrer">LinkedIn</a></p>
            <p id="location-line"></p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="shell footer-inner">
      <span>&copy; <span id="year"></span> Brooke Oberlee</span>
      <span>Mechanical Engineering, UMass Amherst</span>
    </div>
  </footer>
</body>
</html>
